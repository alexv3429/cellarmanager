minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and safe fixes
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]

      - id: javascript-syntax
        name: JavaScript syntax
        entry: scripts/check_javascript.sh
        language: system
        types: [javascript]

      - id: repository-policy
        name: Repository policy
        entry: uv run --frozen python scripts/check_repository.py
        language: system
        pass_filenames: false
        always_run: true

      - id: backend-tests
        name: Backend tests
        entry: uv run --frozen pytest -c pyproject.toml backend/tests
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-tests
        name: Frontend tests
        entry: bash -c 'node --test frontend/tests/*.test.js'
        language: system
        pass_filenames: false
        stages: [pre-push]
