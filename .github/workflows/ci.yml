name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: pytest backend
        env:
          WINECELLAR_SECRET_KEY: ci-only-secret-change-me
          WINECELLAR_DB_PATH: /tmp/winecellar-ci.db
          WINECELLAR_SETUP_TOKEN: ci-setup-token

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test frontend/tests/*.test.js
      - name: JavaScript syntax
        run: |
          find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check frontend/service-worker.js
