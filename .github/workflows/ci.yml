name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-tests:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check repository policy
        run: npm run repository:check

      - name: Lint, test, and build the web application
        run: npm run web:ci

  database-tests:
    name: Supabase database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm run supabase -- start

      - name: Run Supabase database tests
        run: npm run supabase -- test db

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Audit locked dependencies
        run: npm run audit

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - web-tests
      - database-tests
      - dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          WEB: ${{ needs.web-tests.result }}
          DATABASE: ${{ needs.database-tests.result }}
          DEPENDENCIES: ${{ needs.dependency-audit.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WEB" = "success"
          test "$DATABASE" = "success"
          test "$DEPENDENCIES" = "success"
