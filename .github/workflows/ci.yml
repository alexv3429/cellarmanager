name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      UV_DEFAULT_INDEX: "https://pypi.org/simple"
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --frozen --group dev

      - name: Verify lock file
        run: uv lock --check

      - name: Ruff format check
        run: uv run --frozen ruff format --check backend scripts

      - name: Ruff lint
        run: uv run --frozen ruff check backend scripts

      - name: Repository policy checks
        run: uv run --frozen python scripts/check_repository.py

  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_DEFAULT_INDEX: "https://pypi.org/simple"
      WINECELLAR_SECRET_KEY: ci-only-secret-change-me
      WINECELLAR_DB_PATH: /tmp/winecellar-ci-${{ matrix.python-version }}.db
      WINECELLAR_SETUP_TOKEN: ci-setup-token
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --frozen --group dev

      - name: Compile Python sources
        run: uv run --frozen python -m compileall -q backend/app backend/tests

      - name: Run backend test suite
        run: >-
          uv run --frozen pytest -c pyproject.toml
          --cov=backend/app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          backend/tests

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".node-version"

      - name: JavaScript syntax
        shell: bash
        run: |
          ./scripts/check_javascript.sh

      - name: Frontend unit tests
        run: node --test frontend/tests/*.test.js

  dependency-review:
      name: Dependency audit
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-latest
      timeout-minutes: 10

      env:
        UV_PYTHON: "3.12"
        UV_DEFAULT_INDEX: "https://pypi.org/simple"

      steps:
        - name: Check out repository
          uses: actions/checkout@v7
          with:
            persist-credentials: false

        - name: Install uv and Python
          uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
          with:
            python-version: "3.12"
            enable-cache: true

        - name: Verify lock file
          run: uv lock --check

        - name: Audit locked dependencies
          run: uv audit --frozen

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - quality
      - backend-tests
      - frontend-tests
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          QUALITY: ${{ needs.quality.result }}
          BACKEND: ${{ needs.backend-tests.result }}
          FRONTEND: ${{ needs.frontend-tests.result }}
          DEPENDENCIES: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALITY" = "success"
          test "$BACKEND" = "success"
          test "$FRONTEND" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$DEPENDENCIES" = "success"
          else
            test "$DEPENDENCIES" = "skipped"
          fi
