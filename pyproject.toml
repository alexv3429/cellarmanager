[project]
name = "cellarmanager"
version = "0.1.0"
description = "Self-hosted, offline-capable wine cellar manager"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "python-multipart>=0.0.9",
  "Pillow>=10.3",
  "pytesseract>=0.3.10",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pre-commit>=4,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1.0",
]

[tool.uv]
package = false
required-version = ">=0.10.0,<0.12.0"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
pythonpath = ["backend"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["backend/app"]
omit = [
  "backend/app/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "scripts"]
force-exclude = true
extend-exclude = [
  ".patch-backups",
  "backend/data",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
]
ignore = [
  "B008", # FastAPI dependency injection intentionally calls Depends in defaults.
  "B904", # Existing HTTP translation code is migrated gradually.
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"backend/**/__init__.py" = ["F401"]
"backend/tests/**/*.py" = ["B017"]
